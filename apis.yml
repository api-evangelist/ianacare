aid: ianacare
name: ianacare
description: >-
  ianacare ("iana" = I Am Not Alone) is a Boston-based caregiver support and navigation
  platform that sells to employers, health plans and providers as a benefit for the
  working family caregivers in their populations. Founded in 2018 by Jessica Kim and
  Steven Lee, it pairs a consumer mobile app — where a caregiver mobilizes an informal
  care team, coordinates practical tasks, unlocks employer benefits and finds local
  resources — with human Caregiver Navigators, and positions itself as a partner for
  fulfilling CMS GUIDE Model dementia-care requirements. The company raised a $12.1M
  Series A in January 2022 led by Greycroft with 8VC, SemperVirens, Able Partners and
  the Brown Angel Group. ianacare ships software only as an end-user product: the iOS
  and Android apps and the app.ianacare.com web client are backed by first-party hosts
  (iana.ianacare.com behind a JWT bearer token, api.ianacare.com behind a CloudFront
  403) and by ianacare's own Auth0 custom domain auth.ianacare.com, which is the single
  machine-readable contract the company publishes. There is no developer portal, API
  reference, OpenAPI, SDK, CLI, webhook catalog, MCP server or agent card on any
  ianacare host.
